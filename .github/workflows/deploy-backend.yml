name: Deploy Backend

# Builds the FastAPI container once and deploys it to Cloud Run (production).
# Runs only for pushes to main that change the backend app, never for test or
# doc-only changes. Authentication is keyless (Workload Identity Federation),
# restricted by Google Cloud to this repository's main branch.
on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - "!backend/test_*.py"
      - "!backend/smoke_test.*"
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: lagaw-api

jobs:
  deploy:
    name: Deploy - Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Skips with a visible reason, staying green, until the GCP settings exist.
      - name: Decide whether to deploy
        id: gate
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          skip() {
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: $1"
            echo "Deploy skipped: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          [ -f backend/Dockerfile ] || skip "backend/Dockerfile is missing."
          for v in PROJECT REGION PROVIDER DEPLOYER RUNTIME; do
            [ -n "${!v}" ] || skip "the GCP_* repository variables are not set ($v)."
          done

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:${{ github.sha }}
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --timeout=60
            --port=8080

      # Proves the deployed API can read the production database.
      - name: Smoke test
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -eo pipefail
          url="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 \
            "$url/locations?limit=1" | python -c "import sys,json; d=json.load(sys.stdin); assert d['items'], 'no locations returned'; print('smoke test ok:', len(d['items']), 'location')"
          echo "### Deployed to Cloud Run (production)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
